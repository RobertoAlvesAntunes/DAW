<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Incluir Disciplina</title>

    <script>
        function EnviarDisciplina() {
            let sigla = document.getElementById("sigla").value;
            let nome = document.getElementById("nome").value;
            let carga = document.getElementById("carga").value;

            let xmlhttp = new XMLHttpRequest();

            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById("msg").innerHTML = this.responseText;
                } else if (this.readyState == 4) {
                    document.getElementById("msg").innerHTML = "Erro na requisição: " + this.status;
                }
            }

            xmlhttp.open("GET", "IncluirDisciplina.php?sigla=" + encodeURIComponent(sigla) + "&nome=" + encodeURIComponent(nome) + "&carga=" + encodeURIComponent(carga));

            xmlhttp.send();
        }
    </script>
</head>

<body>

    <h1>Inserir Disciplina</h1>

    <form action="" method="GET" name="formDisciplina" id="formDisciplina">
        Sigla: <input type="text" name="sigla" id="sigla">
        <br>
        Nome: <input type="text" name="nome" id="nome">
        <br>
        Carga horária: <input type="text" name="carga" id="carga">
        <br><br>
        <input type="button" value="Inserir" onclick="EnviarDisciplina()">
    </form>

    <p id="msg"></p>

</body>
</html>
