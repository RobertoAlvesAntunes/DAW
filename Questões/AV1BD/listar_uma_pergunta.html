<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Uma Pergunta</title>

    <script>
        function Buscar() {
            let IDpergunta = document.getElementById("IDpergunta").value;

            let xmlhttp = new XMLHttpRequest();

            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    let objRetorno = JSON.parse(this.responseText);
                    let resultado = document.getElementById("resultado");
                    resultado.innerHTML = "";

                    if (objRetorno.encontrou == "sim") {
                        MostrarPergunta(objRetorno);
                    } else {
                        resultado.innerHTML = "Pergunta não encontrada.";
                    }
                } else if (this.readyState == 4) {
                    document.getElementById("resultado").innerHTML = "Erro na requisição: " + this.status;
                }
            }

            xmlhttp.open("GET", "listar_uma_pergunta.php?IDpergunta=" + encodeURIComponent(IDpergunta));

            xmlhttp.send();
        }

        function MostrarPergunta(pergunta) {
            let resultado = document.getElementById("resultado");

            let h3 = document.createElement("h3");
            h3.appendChild(document.createTextNode(pergunta.pergunta));
            resultado.appendChild(h3);

            let p = document.createElement("p");
            p.appendChild(document.createTextNode("IDpergunta: " + pergunta.IDpergunta));
            resultado.appendChild(p);

            let ul = document.createElement("ul");

            for (let i = 0; i < pergunta.respostas.length; i++) {
                let resp = pergunta.respostas[i];
                let li = document.createElement("li");
                li.appendChild(document.createTextNode(resp.resposta + " (certa: " + resp.certa + ")"));
                ul.appendChild(li);
            }

            resultado.appendChild(ul);
        }
    </script>
</head>

<body>

    <h1>Listar Uma Pergunta</h1>

    <form action="" method="GET" name="frmBuscar" id="frmBuscar">
        IDpergunta: <input type="text" name="IDpergunta" id="IDpergunta">
        <br><br>
        <input type="button" value="Buscar" onclick="Buscar()">
    </form>

    <br>

    <div id="resultado"></div>

</body>
</html>
